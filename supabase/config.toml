# Configuración local de Supabase (supabase start / db reset / test db).
# Requiere Docker Desktop. Ver README para alternativas sin Docker.
#
# NOTA (Windows): los puertos 54321-54324 caen dentro de los rangos de puertos
# EXCLUIDOS que Windows reserva dinámicamente (p. ej. 54244-54343), así que
# Docker no puede publicarlos ("bind: Intento de acceso a un socket no
# permitido por sus permisos de acceso"). Por eso se usa la franja libre
# 55321-55324. El portproxy 8450 (móvil/Tailscale) apunta a la API 55321:
#   netsh interface portproxy add v4tov4 listenport=8450 connectport=55321 connectaddress=127.0.0.1
project_id = "estufas"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
major_version = 17

[studio]
enabled = true
port = 55323

[inbucket]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:8081"
additional_redirect_urls = ["http://localhost:8081", "http://127.0.0.1:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false

[functions]

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
