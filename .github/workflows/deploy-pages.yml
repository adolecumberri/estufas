name: Deploy web a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web (SPA, Supabase Cloud)
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://bvulkrggcicftjalfctz.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_l6ITyPAxeK5XxHizqelw-Q_vaBsbueD

      - name: Preparar dist para Pages (SPA deep links + no Jekyll)
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
